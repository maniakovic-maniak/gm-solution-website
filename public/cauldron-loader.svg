<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title description">
  <title id="title">Magic maths potion loader</title><desc id="description">A rounded dark cauldron bubbles with a green potion, green maths symbols, and curling steam flames.</desc>
  <defs>
    <radialGradient id="potion" cx="45%" cy="30%" r="72%"><stop stop-color="#d9f26e"/><stop offset=".5" stop-color="#9bd900"/><stop offset="1" stop-color="#70ad00"/></radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#414161"/><stop offset=".55" stop-color="#292842"/><stop offset="1" stop-color="#151323"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#545376"/><stop offset="1" stop-color="#29273f"/></linearGradient>
  </defs>
  <!-- loop handles -->
  <g fill="none" stroke="#1a182b" stroke-width="12" stroke-linecap="round"><path d="M79 157c-28-22-45 24-17 27 12 1 18-9 18-17"/><path d="M221 157c28-22 45 24 17 27-12 1-18-9-18-17"/></g>
  <g fill="none" stroke="#5b587a" stroke-width="4" opacity=".8"><path d="M76 162c-16-11-27 14-13 16"/><path d="M224 162c16-11 27 14 13 16"/></g>
  <!-- rotund cauldron -->
  <path d="M83 139c-16 21-16 73 3 98 25 34 102 39 132 1 21-27 20-77-2-99Z" fill="url(#pot)" stroke="#171526" stroke-width="7"/>
  <ellipse cx="126" cy="188" rx="42" ry="47" fill="#5b597b" opacity=".6"/><circle cx="106" cy="175" r="16" fill="#9895b7" opacity=".65"/><circle cx="97" cy="204" r="7" fill="#b4b1cd" opacity=".55"/>
  <!-- large upper rim -->
  <ellipse cx="150" cy="135" rx="76" ry="29" fill="url(#rim)" stroke="#29263e" stroke-width="5"/>
  <ellipse cx="150" cy="134" rx="64" ry="20" fill="#171426"/>
  <ellipse cx="150" cy="135" rx="56" ry="15" fill="url(#potion)"/>
  <ellipse cx="150" cy="131" rx="36" ry="7" fill="#d3ee5c" opacity=".45"/>
  <!-- green flame-like steam, behind the bubbles -->
  <g fill="#a9d95a" opacity=".27">
    <path d="M123 132c-22-21 15-28 1-52-7-13-25-15-26-15 23 14 4 29 1 40-4 14 10 22 24 27Z"><animate attributeName="opacity" values=".16;.36;.16" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M165 132c21-25-18-38-1-62 8-12 24-12 29-9-20 4-11 25-7 38 5 15-7 27-21 33Z"><animate attributeName="opacity" values=".34;.14;.34" dur="2.5s" repeatCount="indefinite"/></path>
    <path d="M144 130c-9-22 16-32 4-50-5-8-14-11-19-12 15 13 0 27 1 40 1 10 8 17 14 22Z"/>
  </g>
  <!-- surface bubbles -->
  <g fill="#b7e94a" stroke="#e4f998" stroke-width="2"><circle cx="122" cy="133" r="4"><animate attributeName="r" values="2;8;2" dur="1.45s" repeatCount="indefinite"/></circle><circle cx="168" cy="131" r="4"><animate attributeName="r" values="2;9;2" dur="1.75s" begin="-.65s" repeatCount="indefinite"/></circle><circle cx="150" cy="140" r="3"><animate attributeName="r" values="2;6;2" dur="1.2s" begin="-.3s" repeatCount="indefinite"/></circle></g>
  <!-- One mixed plume: symbols and vapour bubbles rise, sway, and fade together. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800" text-anchor="middle" fill="#000" stroke="none">
    <g><circle cx="131" cy="119" r="9" fill="#b7e94a" stroke="#c9ee62" stroke-width="1.2"/><text x="131" y="124" font-size="21">+</text><circle cx="164" cy="105" r="7" fill="#b7e94a" stroke="#c9ee62" stroke-width="1.2"/><text x="164" y="110" font-size="18">π</text><text x="146" y="87" font-size="29">∑</text><animateTransform attributeName="transform" type="translate" values="0 0;7 -80" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.2;.78;1" dur="2.8s" repeatCount="indefinite"/></g>
    <g><circle cx="151" cy="118" r="6" fill="#b7e94a" stroke="#c9ee62" stroke-width="1.2"/><text x="151" y="122" font-size="15">÷</text><text x="179" y="97" font-size="27">x²</text><circle cx="130" cy="84" r="6" fill="#b7e94a" stroke="#c9ee62" stroke-width="1.2"/><text x="130" y="88" font-size="15">∞</text><animateTransform attributeName="transform" type="translate" values="0 0;-6 -74" dur="2.8s" begin="-.93s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.2;.78;1" dur="2.8s" begin="-.93s" repeatCount="indefinite"/></g>
    <g><text x="119" y="111" font-size="28">√</text><circle cx="169" cy="116" r="8" fill="#b7e94a" stroke="#c9ee62" stroke-width="1.2"/><text x="169" y="121" font-size="18">=</text><text x="150" y="92" font-size="27">42</text><animateTransform attributeName="transform" type="translate" values="0 0;5 -86" dur="2.8s" begin="-1.86s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.2;.78;1" dur="2.8s" begin="-1.86s" repeatCount="indefinite"/></g>
  </g>
</svg>
